[package]
name = "plusplus-server"
version = "0.1.0"
edition = "2021"

[dependencies]
indexer = { path = "../indexer" }
offer-protocol = { path = "../offer-protocol" }
swap-executor = { path = "../swap-executor" }
channel-manager = { path = "../channel-manager" }
router = { path = "../router" }
fiber-client = { path = "../fiber-client" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hex = "0.4"
blake2b-rs = "0.2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
