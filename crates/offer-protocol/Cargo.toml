[package]
name = "offer-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
ckb-types = "0.119"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake2b-rs = "0.2"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
rand_core = "0.10.1"

[dev-dependencies]
rand = "0.10.2"
signature = "3.0.0"
tempfile = "3"
