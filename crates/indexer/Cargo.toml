[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
offer-protocol = { path = "../offer-protocol" }
swap-executor = { path = "../swap-executor" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
blake2b-rs = "0.2"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
