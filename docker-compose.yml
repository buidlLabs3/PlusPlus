# ++ DEX — Docker Compose
# Single-command deployment: docker-compose up -d

services:
  plusplus-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plusplus-dex
    ports:
      - "3000:3000"
    environment:
      - PLUSPLUS_DB=/app/data/plusplus.db
      - RUST_LOG=info
      - PLUSPLUS_NETWORK=testnet
      # Fiber node connection (set these for real Fiber integration)
      - FIBER_NODE_1_URL=${FIBER_NODE_1_URL:-http://127.0.0.1:8227}
      - FIBER_NODE_2_URL=${FIBER_NODE_2_URL:-http://127.0.0.1:8237}
      - FIBER_REQUEST_TIMEOUT=${FIBER_REQUEST_TIMEOUT:-30}
      - FIBER_MAX_RETRIES=${FIBER_MAX_RETRIES:-3}
      - FIBER_CIRCUIT_THRESHOLD=${FIBER_CIRCUIT_THRESHOLD:-5}
    volumes:
      - plusplus-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - plusplus

volumes:
  plusplus-data:
    driver: local

networks:
  plusplus:
    driver: bridge
